<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0078d7; /* Azul claro exato da BSOD do Windows */
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            width: 100vw;
        }

        h1 {
            font-size: 4rem;
            font-weight: 300; /* Peso leve como no Windows */
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>Bem Vindo!</h1>
</body>
</html>
