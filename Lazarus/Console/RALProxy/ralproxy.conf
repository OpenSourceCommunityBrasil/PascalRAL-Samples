# ralproxy.conf - o RALProxy le um subconjunto da sintaxe do NGINX.
# Diretiva desconhecida e' erro (com arquivo, linha e coluna): confira com
#   ralproxy -t -c ralproxy.conf
# Lista das diretivas: https://github.com/OpenSourceCommunityBrasil/PascalRAL/wiki/ralproxy

worker_threads auto;          # threads de cada porta (auto = uma por processador)
error_log logs/erro.log;
pid ralproxy.pid;

http {
  access_log logs/acesso.log combined;   # ou json, ou off
  keepalive_timeout 75s;
  proxy_read_timeout 60s;
  proxy_connect_timeout 5s;

  upstream api {
    least_conn;
    server 127.0.0.1:8101 weight=2;
    server 127.0.0.1:8102 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8103 backup;
    health_check uri=/health interval=5s fails=3 passes=2;
  }

  upstream site {
    server 127.0.0.1:8201;
    sticky cookie servidor;
  }

  server {
    listen 8080;
    server_name api.exemplo.local;
    location /v1/ { proxy_pass http://api/; }    # /v1/x vai como /x
  }

  server {
    listen 8080;
    location = /status { stub_status; }          # estatistica (JSON; ?format=prometheus)
    location / { proxy_pass http://site; }
  }

  # HTTPS: um certificado por nome na mesma porta
  # server {
  #   listen 8443 ssl;
  #   server_name www.exemplo.local;
  #   ssl_certificate certs/www.pem;
  #   ssl_certificate_key certs/www.key;
  #   location / { proxy_pass http://site; }
  # }
}

stream {
  # TCP puro: o banco atras do balanceador
  upstream banco { server 127.0.0.1:5432; }
  server { listen 15432; proxy_pass banco; proxy_timeout 10m; }

  # TLS que passa sem abrir, escolhido pelo nome pedido (SNI)
  # upstream a { server 10.0.0.1:443; }
  # server { listen 9443; server_name a.exemplo.local; proxy_pass a; }
}
